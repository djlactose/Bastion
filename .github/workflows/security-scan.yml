name: Security scan (Trivy)

# Three independent checks:
#   - pip-audit over the hash-pinned Python lockfile,
#   - ShellCheck over the shell scripts,
#   - a Trivy scan of the built image (described below).
#
# Builds the image locally (no push) and scans it with Trivy. On pull requests
# this is a GATE: a dependency bump that still leaves a *fixable* HIGH/CRITICAL
# CVE fails the check, mirroring the manual `docker scout cves --only-fixed`
# loop. Also runs weekly and on demand for independent visibility. Findings are
# uploaded to the repo Security tab as SARIF.

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 07:00 UTC.
    - cron: "0 7 * * 1"

permissions: {}

jobs:
  python-deps:
    # Audits the hash-pinned lockfile against the PyPI advisory database. This
    # catches a vulnerable Python package of any severity without needing an
    # image build, and covers the transitive pins as well as the top-level ones.
    name: Audit Python dependencies (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run pip-audit
        run: |
          pipx run pip-audit==2.10.1 --require-hashes --disable-pip -r web/requirements.txt

  shellcheck:
    # The shell scripts run as root in the container (and servers.sh on every
    # client). Fail on errors; warnings are reported but do not block.
    name: Lint shell scripts (ShellCheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run ShellCheck
        run: |
          shellcheck --version
          shellcheck --severity=error run.sh servers.sh utils/*.sh

  scan:
    name: Build and scan image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (load, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          no-cache: true
          tags: bastion:scan

      - name: Scan image with Trivy (gate on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bastion:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-results.sarif
          trivyignores: .trivyignore

      - name: Upload Trivy results to Security tab
        # Runs even when the scan gate fails, so findings are always visible.
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
