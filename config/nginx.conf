server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/bastion/certs/fullchain.pem;
    ssl_certificate_key /etc/bastion/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # X-Frame-Options / X-Content-Type-Options are set by the Flask app so they
    # also apply in plain-HTTP mode; adding them here would duplicate them.

    server_tokens off;

    location / {
        # Private Unix socket (see run.sh). The app trusts the X-Forwarded-*
        # headers below only on requests that arrive over this socket.
        proxy_pass http://unix:/run/bastion/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite rather than append: whatever the client sent is discarded.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
